name: 'Gemini Assistant'

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  gemini:
    if: contains(github.event.comment.body, '@gemini-cli')
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Run Gemini CLI'
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          prompt: |
            Ты — опытный разработчик, специалист по базам данных.
            Это репозиторий для тренировки по нормализации БД (1НФ, 2НФ, 3НФ).
            
            Пользователь написал комментарий:
            "${{ github.event.comment.body }}"
            
            Выполни задачу, которую просит пользователь.
            Если нужно написать код — создай файлы, сделай коммит и открой Pull Request.
            Всегда отвечай в этом же Issue.
